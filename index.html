<style>
:root{
  --paper:#F4F4F2; --surface:#FFFFFF; --ink:#1E2024; --ink-2:#5D6168; --line:#DCDDDA;
  --brand:#F2B91A; --brand-ink:#1E2024; --brand-soft:#FCF1CF; --graphite:#4B4E54;
  --green:#2E6A45; --green-soft:#E1EBE3; --amber:#9C6210; --amber-soft:#F6EAD3;
  --red:#A33F2A; --red-soft:#F5E0DA; --blue:#2C5A86; --blue-soft:#DFE8F1; --focus:#2C5A86;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#141518; --surface:#1C1D21; --ink:#E9EAEC; --ink-2:#A7AAB0; --line:#303237;
  --brand:#F5C33B; --brand-ink:#16171A; --brand-soft:#3A3117; --graphite:#C9CBCF;
  --green:#7DC196; --green-soft:#20352A; --amber:#E0AE5C; --amber-soft:#3A2E17; --red:#EE8D78; --red-soft:#3D221C; --blue:#8DB6DE; --blue-soft:#1C2C3C; --focus:#8DB6DE; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#141518; --surface:#1C1D21; --ink:#E9EAEC; --ink-2:#A7AAB0; --line:#303237;
  --brand:#F5C33B; --brand-ink:#16171A; --brand-soft:#3A3117; --graphite:#C9CBCF;
  --green:#7DC196; --green-soft:#20352A; --amber:#E0AE5C; --amber-soft:#3A2E17; --red:#EE8D78; --red-soft:#3D221C; --blue:#8DB6DE; --blue-soft:#1C2C3C; --focus:#8DB6DE; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);border-top:4px solid var(--brand)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-stretch:75%;font-weight:760;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:14px;color:var(--graphite)}
.brand .logo{height:40px;width:auto;display:block} .brand .logo.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo.lt{display:none} :root:not([data-theme="light"]) .brand .logo.dk{display:block}}
:root[data-theme="dark"] .brand .logo.lt{display:none} :root[data-theme="dark"] .brand .logo.dk{display:block}
.brand .sep{width:1px;height:28px;background:var(--line)}
@media (max-width:560px){ .brand .logo{height:30px} .brand .nm,.brand .sep{display:none} }
.brand small{font-weight:450;font-stretch:100%;color:var(--ink-2);font-size:13px}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period input{border:1px solid var(--line);background:var(--surface);height:34px;border-radius:8px;padding:0 8px}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.quick button[aria-pressed="true"]{background:var(--graphite);color:var(--paper);border-color:var(--graphite)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.primary:hover{filter:brightness(.96);border-color:var(--brand)}
:root[data-theme="dark"] .btn.primary{color:#0f1a13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a13}}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 14px 10px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:560;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs .count{font-size:12px;margin-left:5px;color:var(--ink-2);font-weight:450}

h1.page{font-stretch:70%;font-weight:800;font-size:clamp(32px,5vw,50px);line-height:1;margin:26px 0 6px}
p.lede{margin:0 0 18px;color:var(--ink-2);max-width:72ch}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:112px}
.card:hover{border-color:var(--ink-2)}
.card .q{font-size:13px;color:var(--ink-2)}
.card .t{font-weight:680;font-size:15px}
.card .v{font-weight:780;font-size:clamp(20px,2.4vw,26px);font-stretch:88%;margin-top:auto}
.card .s{font-size:12.5px;color:var(--ink-2)}
.card.g{border-top-color:var(--green)} .card.g .v{color:var(--green)}
.card.a{border-top-color:var(--amber)} .card.a .v{color:var(--amber)}
.card.r{border-top-color:var(--red)} .card.r .v{color:var(--red)}
.card.b{border-top-color:var(--blue)}
section.block{margin-top:30px}
section.block>h2{font-stretch:75%;font-weight:760;font-size:23px;margin:0 0 4px}
section.block>p.sub{margin:0 0 12px;color:var(--ink-2);max-width:72ch}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.bar:hover{border-color:var(--ink-2)}
.bar .nm{font-weight:620}
.bar .tr{height:10px;background:var(--paper);border-radius:99px;overflow:hidden;display:flex}
.bar .tr span{display:block;height:100%}
.bar .vl{text-align:right;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--paper)}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
td .small,.small{display:block;font-size:12.5px;color:var(--ink-2)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:620;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.ok{background:var(--green-soft);color:var(--green)}
.st.conf{background:var(--amber-soft);color:var(--amber)}
.st.ni{background:var(--red-soft);color:var(--red)}
.st.out{background:var(--blue-soft);color:var(--blue)}
.st.serv{background:#EDE4F6;color:#7A4BA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.serv{background:#2E2340;color:#C7A6EC}}
.st.neu{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.toolbar .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:220px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
/* importação */
.imp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.imp .panel h3{margin:0 0 4px;font-size:16px}
.imp .panel p{margin:0 0 12px;color:var(--ink-2);font-size:13.5px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:var(--paper);font-size:14px}
.drop.big{padding:34px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.drop.big strong{font-size:18px}
.drop.big span{color:var(--ink-2)}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.map label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.map select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px}
.map label.req select{border-color:var(--green)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(980px,96vw);max-height:90vh}
dialog.narrow{width:min(620px,96vw)}
dialog::backdrop{background:rgba(10,15,12,.5)}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-h h3{margin:0;font-size:18px}
.dlg-h .tot{font-size:24px;font-weight:780;font-stretch:88%}
.dlg-h p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.dlg-b{padding:14px 20px;overflow:auto;max-height:66vh}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-f .sp{flex:1}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.facts div{background:var(--paper);border-radius:8px;padding:8px 10px}
.facts span{display:block;font-size:12px;color:var(--ink-2)} .facts b{font-size:15px}
.cand{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.cand:hover{border-color:var(--ink-2)}
.cand.sel{border-color:var(--green);background:var(--green-soft)}
.cand .v{font-weight:700;white-space:nowrap;text-align:right}
.sumline{font-size:14px}
.sumline b.ok{color:var(--green)} .sumline b.bad{color:var(--red)}
body.mododia .top-in .period,body.mododia #quick,body.mododia header .btn.primary{display:none}
.dayhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.dayhead .sp{flex:1}
.daynav{display:flex;gap:4px;align-items:center}
.daynav input{border:1px solid var(--line);background:var(--surface);height:36px;border-radius:8px;padding:0 8px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.step .ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--amber-soft);color:var(--amber);flex:none}
.step.done .ck{background:var(--green-soft);color:var(--green)}
.steps .drop{display:flex;flex-direction:column;justify-content:center;padding:10px}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.mini:hover{border-color:var(--ink-2)} .mini span{font-size:12.5px;color:var(--ink-2)} .mini b{font-size:18px;font-stretch:90%}
.mini.g{border-left-color:var(--green)} .mini.g b{color:var(--green)} .mini.a{border-left-color:var(--amber)} .mini.a b{color:var(--amber)} .mini.r{border-left-color:var(--red)} .mini.r b{color:var(--red)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.board .col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:260px}
.colh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.lista{overflow:auto;max-height:480px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);justify-self:center}
.dot.ok{background:var(--green)} .dot.conf{background:var(--amber)} .dot.ni{background:var(--red)} .dot.out{background:var(--blue)} .dot.serv{background:#7A4BA8}
.cand.ent.sel{border-color:var(--blue);background:var(--blue-soft)}
.linkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.linkbar .sp{flex:1}
@media (max-width:900px){ .steps,.minis{grid-template-columns:1fr 1fr} .board{grid-template-columns:1fr} }
.fsel{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-size:13px;max-width:150px}
.fwrap{display:block;margin-top:4px}
.sync{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.sync.ok{color:var(--green)} .sync.pend{color:var(--ink-2)} .sync.err{color:var(--red);border-color:var(--red);background:var(--red-soft);font-weight:650}
@keyframes flash{0%{background:var(--amber-soft)}100%{background:transparent}}
tr.flash td,.cand.flash{animation:flash 1.8s ease-out}
body.conectando header .period,body.conectando #quick,body.conectando nav.tabs,body.conectando #sync,body.conectando header .btn{display:none}
.cond-chart{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.donut svg{width:100%;max-width:220px;display:block;margin:0 auto}
.donut .dz1{font:800 15px "Archivo",sans-serif;fill:var(--ink)} .donut .dz2{font:12px "Archivo",sans-serif;fill:var(--ink-2)}
.cond-leg{display:grid;gap:6px}
.cond-row{display:grid;grid-template-columns:14px minmax(110px,170px) minmax(0,1fr) 120px;gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left;width:100%}
.cond-row:hover{border-color:var(--line);background:var(--paper)}
.cond-row i{width:12px;height:12px;border-radius:3px}
.cond-row .nm{font-weight:620}
.cond-row .br{height:9px;background:var(--paper);border-radius:99px;overflow:hidden;display:block}
.cond-row .br span{display:block;height:100%;border-radius:99px}
.cond-row .vl{text-align:right;font-weight:700}
@media (max-width:760px){ .cond-chart{grid-template-columns:1fr} .cond-row{grid-template-columns:14px minmax(0,1fr) 110px} .cond-row .br{display:none} }
.otag{display:inline-block;margin:3px 0 0 0;font-size:11px;font-weight:650;border-radius:4px;padding:1px 6px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.otag.o-venda{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.otag.o-titulo{background:var(--green-soft);color:var(--green);border-color:transparent}
.otag.o-parcial{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.toolbar.orig{margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;max-width:min(600px,92vw);z-index:60;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.statusline{font-size:12.5px;color:var(--ink-2)}
@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .imp,.two{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr} .bar{grid-template-columns:110px minmax(0,1fr) 110px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=c=>BRL.format((c||0)/100);
const br=d=>d?d.split('-').reverse().join('/'):'';
const brs=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
function addDays(d,n){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function today(){const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10);}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const sum=(a,f=x=>x.valor)=>a.reduce((s,x)=>s+(f(x)||0),0);
function toast(m,ms=4500){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}

/* ============ dados da empresa ============ */
const EMPRESA={nome:'Correa Auto Peças',razao:'CORREA AUTO PECAS E SUPRIMENTOS LTDA',cnpj:'66.032.600/0001-40',
  contas:[{banco:'Sicoob',desc:'Sicoob Credirochas · coop. 3260-3 · conta 229.559-8'},{banco:'Bradesco',desc:'Bradesco · ag. 2986 · conta 0003714-1'}]};
// crédito vindo da própria Correa (transferência entre as contas Sicoob ⇄ Bradesco) não é venda
// créditos que não entram no app: PIX da Cielo e depósito de cheque pelo celular (Sicoob)
const ignorarEntrada=e=>{ const t=norm((e.desc||'')+' '+(e.pagador||'')); return /CIELO/.test(t)||/DEP(OSITO|\.)?\s*(DE\s*)?CHEQUE|CHEQUE.*CELULAR|CELULAR.*CHEQUE|DEP\w*\s*CH(Q|EQ)?\b.*CEL/.test(t); };
const rendimento=e=>/RENTAB|INVEST FACIL|RENDIMENTO|APLICACAO/.test(norm(e.desc));
const contaPropria=e=>{ const t=norm(e.desc+' '+e.pagador); return /CORREA AUTO PECAS|0?66\.?032\.?600/.test(t); };

// Cielo: o crédito no banco é o repasse dos cartões vendidos no dia anterior
const ehCielo=e=>/CIELO/.test(norm((e.desc||'')+' '+(e.pagador||'')));
const diaCartoes=e=>addDays(e.date,-1);
function marcarCielo(e){ const ref=diaCartoes(e); e.st='ok'; e.links=[]; e.auto=true; e.cielo=true; e.refDia=ref; e.motivo=`Recebimento dos cartões de ${brs(ref)} (dia anterior)`; }
function cartoesDoDia(d){ const vs=D.vendas.filter(v=>v.forma==='Cartão'&&v.date===d); const rs=D.receber.filter(r=>r.baixado&&r.dataBaixa===d&&r.formaRec==='Cartão');
  return {total:sum(vs)+sum(rs),n:vs.length+rs.length}; }

// dias cobertos por cada extrato importado (para saber que o extrato do dia veio, mesmo sem crédito)
const extratoCobre=(banco,d)=>{ const a=AJ.cob[banco+'_'+d]; return !!a&&!a.off; };
async function registrarCobertura(c){ if(!c||!c.de||!c.ate) return; const t=new Date().toISOString();
  for(let d=c.de, n=0; d<=c.ate&&n<62; d=addDays(d,1), n++){ const k=c.banco+'_'+d; if(!AJ.cob[k]||AJ.cob[k].off) await gravarAjuste('cob',k,{t}); } }

/* ============ pedido/título que muda de data (nota editada ou gerada depois) ============ */
// Títulos do Contas a Receber são identificados pelo Doc. Nº (número do pedido) + parcela.
const parcelaDe=r=>{ const m=/-(\d+)\s*$/.exec(String(r.titulo||'')); return m?m[1]:'001'; };
const bizRec=r=>(r.pedido||r.doc||'')+'|'+parcelaDe(r)+(r.parcial?'|P|'+(r.dataBaixa||'')+'|'+(r.valorPago!=null?r.valorPago:r.valor):'');
const recTs=r=>(r.emissao||'')+'|'+(r.baixado?(r.dataBaixa||'0'):'');
const titRef=r=>{ const p=r.pedido||r.doc||'—'; return r.origem==='contas'&&r.titulo?`Pedido ${p} · parc. ${parcelaDe(r)}`:`Pedido ${p}`; };
function remapLinks(mapa){ const ids=Object.keys(mapa); if(!ids.length) return;
  D.entradas.forEach(e=>{ if(e.links&&e.links.some(i=>mapa[i])){ e.links=[...new Set(e.links.map(i=>mapa[i]||i))]; touch('entradas',e); } });
  for(const eid in AJ.conc){ const a=AJ.conc[eid]; if(a&&a.links&&a.links.some(i=>mapa[i])) gravarAjuste('conc',eid,Object.assign({},a,{links:[...new Set(a.links.map(i=>mapa[i]||i))]})); }
  for(const o in mapa){ if(AJ.formas[o]&&!AJ.formas[mapa[o]]) gravarAjuste('formas',mapa[o],AJ.formas[o]); } }
// vale a versão mais recente: some da data antiga e fica só na data em que foi alterado
function deduplicarPorPedido(){
  const fora=new Set(), mapa={};
  const grupo=(lista,chave)=>{ const g={}; lista.forEach(x=>{ const k=chave(x); if(k) (g[k]=g[k]||[]).push(x); }); return g; };
  // vendas: por número do pedido, fica a data mais recente
  const gv=grupo(D.vendas.filter(v=>v.pedido&&!/^vm/.test(v.id)),v=>v.pedido);
  for(const p in gv){ const xs=gv[p]; if(xs.length<2) continue; const max=xs.reduce((a,v)=>v.date>a?v.date:a,'');
    const ficam=xs.filter(v=>v.date===max), seen=new Set();
    ficam.forEach(v=>{ if(seen.has(v.id)) fora.add(v); else seen.add(v.id); });
    xs.filter(v=>v.date!==max).forEach(v=>{ fora.add(v); if(!seen.has(v.id)) mapa[v.id]=ficam[0].id; }); }
  // títulos gerados pelo Listar Pedido (a prazo): ficam os da versão mais recente do pedido
  const gr=grupo(D.receber.filter(r=>r.origem==='venda'&&r.pedido),r=>r.pedido);
  for(const p in gr){ const xs=gr[p]; const max=xs.reduce((a,r)=>(r.emissao||'')>a?(r.emissao||''):a,''); xs.forEach(r=>{ if((r.emissao||'')!==max){ fora.add(r); mapa[r.id]=(xs.find(y=>(y.emissao||'')===max)||{}).id; } }); }
  // títulos do Contas a Receber: Doc. Nº + parcela, fica o mais recente
  const gc=grupo(D.receber.filter(r=>r.origem==='contas'),bizRec);
  for(const k in gc){ const xs=gc[k]; if(xs.length<2) continue; xs.sort((a,b)=>recTs(b).localeCompare(recTs(a))); const fica=xs[0];
    xs.slice(1).forEach(r=>{ fora.add(r); if(r.id!==fica.id) mapa[r.id]=fica.id; }); }
  if(!fora.size) return 0;
  fora.forEach(x=>touch(x.col,x));
  D.vendas=D.vendas.filter(x=>!fora.has(x)); D.receber=D.receber.filter(x=>!fora.has(x));
  reindex(); for(const o in mapa){ if(!mapa[o]||!IDX[mapa[o]]) delete mapa[o]; } remapLinks(mapa);
  // regrava as datas que ficaram (o mesmo lançamento pode ter saído de um dia e continuar em outro)
  D.vendas.forEach(v=>{ if(gv[v.pedido]&&gv[v.pedido].length>1) touch('vendas',v); });
  return fora.size;
}
// importação do Listar Pedido: pedido que já existia em outra data muda para a data nova (ou é ignorado se a versão importada for mais antiga)
function substituirPedidos(vendas,receber,add){
  const porPed={}; vendas.forEach(v=>{ (porPed[v.pedido]=porPed[v.pedido]||[]).push(v); });
  let n=0, movidos=0, antigos=0; const aceitos=new Set(), mapa={};
  for(const p in porPed){ const novas=porPed[p], nd=novas[0].date;
    const ex=D.vendas.filter(v=>v.pedido===p&&!/^vm/.test(v.id));
    const exMax=ex.reduce((a,v)=>v.date>a?v.date:a,'');
    if(exMax&&exMax>nd){ antigos++; continue; }
    if(ex.some(v=>v.date!==nd)) movidos++;
    const exR=D.receber.filter(r=>r.origem==='venda'&&r.pedido===p);
    const idsNovos=new Set(novas.map(v=>v.id));
    ex.forEach(v=>{ if(!idsNovos.has(v.id)) mapa[v.id]=novas[0].id; });
    [...ex,...exR].forEach(x=>{ touch(x.col,x); delete IDX[x.id]; });
    D.vendas=D.vendas.filter(v=>!ex.includes(v)); D.receber=D.receber.filter(r=>!exR.includes(r));
    novas.forEach(v=>{ n+=add('vendas',v); }); aceitos.add(p); }
  receber.forEach(r=>{ if(aceitos.has(r.pedido)&&!D.receber.some(y=>y.id===r.id)) add('receber',r); });
  remapLinks(mapa);
  return {n,movidos,antigos,aceitas:vendas.filter(v=>aceitos.has(v.pedido))};
}

/* ============ leitura de valores e datas ============ */
function parseValor(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return {c:Math.round(v*100),dc:null};

const Store={mode:'local', inicial:null,

    const snaps=await Promise.all(COLS.map(c=>db.collection(c).get()));

function aplicarAjustes(){

    if(x.col==='receber') x.formaRec=a.f==='Não informada'?'':a.f;

  for(const id in AJ.conc){ const e=IDX[id]; const a=AJ.conc[id]; if(!e||!a||e.col!=='entradas') continue;
    e.st=a.st; e.links=(a.links||[]).filter(l=>IDX[l]); e.motivo=a.motivo||''; e.manual=true; e.auto=false; e.cielo=false; if(e.st==='ok'&&!e.links.length) e.st='ni'; }

function mesclarAjustes(rem){ let mudou=false;
  for(const c of ['formas','conc','cob']){ const R=(rem&&rem[c])||{}; for(const id in R){ if(pendAJ.has(c+':'+id)) continue; const L=AJ[c][id];
    if(!R[id]) continue; if(!L||String(R[id].t||'')>String(L.t||'')){ if(JSON.stringify(L)!==JSON.stringify(R[id])){ AJ[c][id]=R[id]; mudou=true; } } } }
  return mudou; }
async function gravarAjuste(campo,id,valor){
  AJ[campo][id]=valor; const pk=campo+':'+id; pendAJ.add(pk); Sync.state='pend'; syncUI();
  let ok=false, erro='';
  if(db){ try{ await db.doc('ajustes/manual').set({[campo]:{[id]:JSON.parse(JSON.stringify(valor))}},{merge:true}); ok=true; }catch(e){ erro=traduzErro(e); } }
  else { try{ localStorage.setItem('corr:ajustes',JSON.stringify(AJ)); ok=true; }catch(e){ erro='armazenamento local indisponível'; } }
  if(ok&&AJ[campo][id]===valor) pendAJ.delete(pk);
  Sync.state=ok?(pendAJ.size||Object.values(dirty).some(x=>x.size)?'pend':'ok'):'err'; Sync.err=ok?'':erro; syncUI();
  if(!ok) toast(`Não foi possível salvar (${erro}). Toque em "tentar de novo" no topo.`,8000);
  return ok;
}
async function enviarAjustes(){ for(const k of [...pendAJ]){ const c=k.slice(0,k.indexOf(':')), id=k.slice(k.indexOf(':')+1); await gravarAjuste(c,id,AJ[c][id]); } }

const dirty={}; let saveTimer=null, flushing=null, flushAgain=false;
function markDirty(col,key){ (dirty[col]=dirty[col]||new Set()).add(key); Sync.state='pend'; syncUI(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); }
async function flush(){
  if(flushing){ flushAgain=true; return flushing; }
  flushing=(async()=>{
    let falhou=false;
    do{ flushAgain=false;
      const jobs=[]; for(const col in dirty){ dirty[col].forEach(k=>jobs.push([col,k])); dirty[col].clear(); }
      if(!jobs.length) break;
      const ok=await Store.putLote(jobs.map(([col,key])=>({col,key})));
      if(!ok){ falhou=true; jobs.forEach(([col,k])=>(dirty[col]=dirty[col]||new Set()).add(k)); }
    } while(flushAgain&&!falhou);
    Sync.state=falhou?'err':(Object.values(dirty).some(x=>x.size)||pendAJ.size?'pend':'ok'); if(!falhou) Sync.err=''; syncUI();
    if(falhou) toast('Não foi possível salvar'+(Sync.err?` (${Sync.err})`:'')+'. Toque em "tentar de novo" no topo.',7000);
  })();
  try{ await flushing; } finally { flushing=null; }
  if(Object.values(dirty).some(x=>x.size)&&Sync.state!=='err') return flush();
}

function ouvirTempoReal(){
  if(!db) return;
  COLS.forEach(col=>{ let primeira=true;
    unsubs.push(db.collection(col).onSnapshot(sn=>{ if(primeira){ primeira=false; return; }
      let mudou=false;
      sn.docChanges().forEach(ch=>{ if(ch.doc.metadata.hasPendingWrites) return; const key=ch.doc.id; if(dirty[col]&&dirty[col].has(key)) return;
        const novos=ch.type==='removed'?[]:((ch.doc.data()||{}).items||[]);
        const atual=D[col].filter(x=>gkey(col,x)===key);
        if(JSON.stringify(atual.map(x=>x.id).sort())===JSON.stringify(novos.map(x=>x.id).sort())&&ch.type==='modified'){
          // mesmos lançamentos: atualiza campos vindos do outro aparelho
          const byId=new Map(novos.map(x=>[x.id,x])); atual.forEach(x=>{ const n=byId.get(x.id); if(n&&JSON.stringify(n)!==JSON.stringify(Object.fromEntries(Object.entries(x).filter(([k])=>k[0]!=='_')))){ Object.assign(x,n,{col}); mudou=true; } });
        } else { D[col]=D[col].filter(x=>gkey(col,x)!==key).concat(novos.map(x=>Object.assign(x,{col}))); mudou=true; } });
      if(mudou) agendarRefreshRT(); },()=>{}));
  });
  unsubs.push(db.doc('ajustes/manual').onSnapshot(sn=>{ if(sn.metadata.hasPendingWrites||!sn.exists) return; if(mesclarAjustes(sn.data())) agendarRefreshRT(); },()=>{}));
}

// status: ok (conciliado), conf (conferir), ni (não identificado), out (outra entrada: transferência própria, estorno etc.)
function candidatos(e,LI,livres=true){
  const out=[]; const pag=e.pagador||'';
  for(const v of D.vendas){ if(livres&&LI[v.id]&&LI[v.id].e!==e) continue; if(v.forma==='A prazo'||v.forma==='Dinheiro'||v.forma==='Cartão'||v.forma==='Cheque') continue;
    const dd=dayDiff(v.date,e.date); if(dd<-1||dd>5) continue;
    out.push({x:v,tipo:'venda',valorOk:v.valor===e.valor,ns:nomeScore(v.cliente,pag+' '+e.desc),dd}); }
  for(const r of D.receber){ if(livres&&LI[r.id]&&LI[r.id].e!==e) continue; if(r.baixado&&CAIXA.includes(r.formaRec)) continue;
    const dd=r.baixado?dayDiff(r.dataBaixa||r.venc,e.date):dayDiff(r.venc,e.date); if(r.baixado?(dd<-6||dd>3):(dd<-60||dd>180)) continue;
    out.push({x:r,tipo:'receber',valorOk:r.valor===e.valor||(!!r.valorAlt&&r.valorAlt===e.valor),ns:nomeScore(r.cliente,pag+' '+e.desc),dd}); }
  return out;
}

const ehDaPagil=x=>/^01\./.test(String(x.pedido||(x.col!=='entradas'?x.doc:'')||'').trim());
function apagarDaPagil(){

  const ids=new Set(fora.map(x=>x.id)); fora.forEach(x=>touch(x.col,x));
  D.vendas=D.vendas.filter(x=>!ids.has(x.id)); D.receber=D.receber.filter(x=>!ids.has(x.id));
  D.entradas.forEach(e=>{ if(e.links&&e.links.some(i=>ids.has(i))){ e.links=e.links.filter(i=>!ids.has(i)); if(!e.links.length&&e.st!=='out'&&e.st!=='serv'){ e.st='ni'; e.auto=false; e.manual=false; e.motivo=''; } touch('entradas',e); } });
  for(const eid in AJ.conc){ const a=AJ.conc[eid]; if(a&&a.links&&a.links.some(i=>ids.has(i))){ const l=a.links.filter(i=>!ids.has(i)); gravarAjuste('conc',eid,Object.assign({},a,{links:l,st:l.length||a.st!=='ok'?a.st:'ni',t:new Date().toISOString()})); } }
  reindex(); return fora.length;
}

    D.receber.forEach(r=>{ if(r.origem!=='contas'||!r.baixado||r.valorPago!=null) return; if(r.juros&&r.valorAlt&&r.valor===r.valorAlt+r.juros){ r.valor=r.valorAlt; } r.valorAlt=!r.parcial&&r.valorTit&&r.valorTit!==r.valor?r.valorTit:0; r.valorPago=r.valor; touch('receber',r); });

function conciliarAuto(){
  limparIgnorados();
  D.entradas.forEach(e=>{ if(!e.manual&&e.st!=='out'&&(contaPropria(e)||rendimento(e))){ e.st='out'; e.links=[]; e.auto=true; e.motivo=rendimento(e)?'Rendimento de aplicação (Invest Fácil)':'Transferência entre contas da Correa'; touch('entradas',e); } });
  D.entradas.forEach(e=>{ if(!e.manual&&e.st!=='out'&&ehCielo(e)){ marcarCielo(e); touch('entradas',e); } else if(e.cielo&&!ehCielo(e)){ e.cielo=false; } });
  const pend=D.entradas.filter(e=>e.st!=='ok'&&e.st!=='out'&&!e.manual);
  pend.forEach(e=>{ e.st='ni'; e.links=[]; e.motivo=''; });
  let LI=linkIndex(); const usados=new Set(Object.keys(LI));
  const res={ok:0,conf:0,ni:0};
  // 1ª passada: certezas (valor exato + nome confere + candidato único)
  const pares=[];
  for(const e of pend){ if(e.forma==='Cartão') continue;
    const c=candidatos(e,LI).filter(c=>c.valorOk);
    const comNome=c.filter(k=>k.ns>=0.5);
    if(comNome.length===1) pares.push({e,k:comNome[0]});
    else if(comNome.length>1){ comNome.sort((a,b)=>(b.ns-a.ns)||(Math.abs(a.dd)-Math.abs(b.dd))); if(comNome[0].ns>comNome[1].ns) pares.push({e,k:comNome[0]}); }
  }
  pares.sort((a,b)=>(b.k.ns-a.k.ns)||(Math.abs(a.k.dd)-Math.abs(b.k.dd)));
  for(const {e,k} of pares){ if(usados.has(k.x.id)||e.st==='ok') continue;
    e.st='ok'; e.auto=true; e.links=[k.x.id]; e.motivo='Valor, cliente e data conferem'; usados.add(k.x.id); }
  // grupos: vários títulos/vendas do mesmo cliente pagos num único valor
  for(const e of pend){ if(e.st==='ok'||e.forma==='Cartão') continue;
    const c=candidatos(e,{}).filter(k=>!usados.has(k.x.id)&&k.ns>=0.5&&k.x.valor<e.valor);
    const porCli={}; c.forEach(k=>{ (porCli[norm(k.x.cliente)]=porCli[norm(k.x.cliente)]||[]).push(k); });
    for(const cli in porCli){ const g=porCli[cli].slice(0,10); const hit=subsetSum(g,e.valor); if(hit){ e.st='ok'; e.auto=true; e.links=hit.map(k=>k.x.id); e.motivo=`${hit.length} lançamentos do mesmo cliente somam o valor`; hit.forEach(k=>usados.add(k.x.id)); break; } }
  }
  // 2ª passada: possibilidades (precisam de conferência)
  for(const e of pend){ if(e.st==='ok') continue;
    if(e.forma==='Cartão'){ e.st='conf'; e.motivo='Repasse de cartão: conferir com a maquininha'; continue; }
    const c=candidatos(e,{}).filter(k=>!usados.has(k.x.id));
    const exatos=c.filter(k=>k.valorOk).sort((a,b)=>(b.ns-a.ns)||(Math.abs(a.dd)-Math.abs(b.dd)));
    if(exatos.length){ e.st='conf'; e.links=[exatos[0].x.id]; usados.add(exatos[0].x.id);
      e.motivo=exatos.length===1?(exatos[0].ns>=0.5?'Valor e cliente conferem, data distante':'Mesmo valor, cliente não confere'):`${exatos.length} lançamentos com o mesmo valor`; continue; }
    const nome=c.filter(k=>k.ns>=0.5).sort((a,b)=>Math.abs(a.x.valor-e.valor)-Math.abs(b.x.valor-e.valor));
    if(nome.length){ e.st='conf'; e.links=[nome[0].x.id]; usados.add(nome[0].x.id); e.motivo='Cliente confere, valor diferente'; continue; }
    e.st='ni'; e.motivo='Nenhuma venda ou recebimento corresponde';
  }
  D.entradas.forEach(e=>{ res[e.st]=(res[e.st]||0)+1; });
  pend.forEach(e=>touch('entradas',e));
  return res;
}
function subsetSum(items,alvo){
  const n=items.length; if(n<2) return null;
  for(let mask=3; mask<(1<<n); mask++){ if((mask&(mask-1))===0) continue; let s=0,sel=[];
    for(let i=0;i<n;i++) if(mask&(1<<i)){ s+=items[i].x.valor; sel.push(items[i]); if(s>alvo) break; }
    if(s===alvo&&sel.length<=5) return sel; }
  return null;
}

/* ============ números do período ============ */
function inP(d){ return d&&d>=S.de&&d<=S.ate; }
function calc(){
  const LI=linkIndex();
  const vendas=D.vendas.filter(v=>inP(v.date));
  const entradas=D.entradas.filter(e=>inP(e.date));
  const statusAlvo=x=>{ const l=LI[x.id]; return l?(l.st==='ok'?'ok':'conf'):null; };
  // vendas: status
  const dExt=D.entradas.map(e=>e.date).sort(); const cobIni=dExt[0], cobFim=dExt[dExt.length-1];
  const coberto=d=>cobIni&&d>=addDays(cobIni,-1)&&d<=cobFim;
  vendas.forEach(v=>{ const l=LI[v.id]; v._e=l?l.e:null;
    v._st= v.forma==='Dinheiro'?'caixa': v.forma==='Cartão'?'maq': v.forma==='Cheque'?'cheque': v.forma==='A prazo'?'prazo': l?(l.st==='ok'?'ok':'conf'):coberto(v.date)?'nao':'semext'; });
  // recebido por forma
  const porForma={}; FORMAS_R.forEach(f=>porForma[f]={total:0,itens:[]});
  vendas.filter(v=>v.forma==='Dinheiro'||v.forma==='Cartão'||v.forma==='Cheque').forEach(v=>{ porForma[v.forma].total+=v.valor; porForma[v.forma].itens.push({k:'venda',x:v}); });
  const cielo=entradas.filter(e=>e.cielo&&e.st==='ok');
  entradas.filter(e=>e.st!=='out'&&!(e.cielo&&e.st==='ok')).forEach(e=>{ const f=e.forma==='Cartão'?'Cartão':e.forma; porForma[f].total+=e.valor; porForma[f].itens.push({k:'entrada',x:e}); });
  D.receber.filter(r=>r.baixado&&inP(r.dataBaixa)&&!LI[r.id]).forEach(r=>{ const f=r.formaRec&&porForma[r.formaRec]?r.formaRec:BSB; porForma[f].total+=r.valor; porForma[f].itens.push({k:'rec',x:r}); });
  // serviços cadastrados à mão (ex.: recebidos em dinheiro) também são dinheiro recebido
  const servMan=D.servicos.filter(x=>inP(x.date));
  servMan.forEach(x=>{ const f=porForma[x.forma]?x.forma:'Outros'; porForma[f].total+=x.valor; porForma[f].itens.push({k:'serv',x}); });
  const recebido=FORMAS_R.reduce((a,f)=>a+porForma[f].total,0);
  const receberAll=D.receber;
  const abertos=receberAll.filter(r=>!r.baixado&&(!LI[r.id]||LI[r.id].st!=='ok'));
  const atrasados=abertos.filter(r=>r.venc<HOJE);
  const previstos=abertos.filter(r=>r.venc>=HOJE);
  const recebidosTit=receberAll.filter(r=>(LI[r.id]&&LI[r.id].st==='ok'&&inP(LI[r.id].e.date))||(r.baixado&&inP(r.dataBaixa)));
  const vendasNaoEntrou=vendas.filter(v=>v._st==='nao'&&v.date<HOJE);
  const baixaNaoEntrou=[]; // título baixado com forma escolhida à mão conta como identificado
  const byst=st=>entradas.filter(e=>e.st===st);
  return {cielo,LI,vendas,entradas,porForma,recebido,abertos,atrasados,previstos,recebidosTit,vendasNaoEntrou,baixaNaoEntrou,
    ok:byst('ok'),conf:byst('conf'),ni:byst('ni'),out:byst('out'),serv:byst('serv'),servMan,
    tVendas:sum(vendas),tEntradas:sum(entradas.filter(e=>e.st!=='out')),statusAlvo};
}

function tabela(rows,opt={}){

      filtro=`<div class="toolbar orig"><div class="chips">${[['todos',`Todos · ${money(sum(rows))}`],...pres.map(o=>[o,`${ORIG[o]} (${rows.filter(r=>r.orig===o).length}) · ${money(sum(rows.filter(r=>r.orig===o)))}`])]
        .map(([k,l])=>`<button data-act="origem" data-fid="${opt.fid}" data-v="${k}" aria-pressed="${cur===k}">${esc(l)}</button>`).join('')}</div></div>`;
      if(cur!=='todos') rows=rows.filter(r=>r.orig===cur); } }

    </tbody><tfoot><tr><td>${rows.length} lançamento(s)</td><td class="num">${money(sum(rows))}</td><td colspan="4">${saldoP?`Saldo restante dos parciais: <b style="color:var(--amber)">${money(saldoP)}</b>`:''}</td></tr></tfoot></table></div>`;
}

/* ============ gráfico: vendas por condição de pagamento ============ */
const COR_COND={'Pix':'#2C8A5E','Dinheiro':'#C99A1E','Cartão':'#2C5A86','Boleto':'#8E5BB5','Transferência':'#3A9BB8','Outros':'#8A8F8C','A prazo (outros)':'#B06B3A'};
const COR_PRAZO=['#D2691E','#B5472E','#E6954F','#9C3D1F','#F2B26B','#C4553A','#7E3A1C'];
function condicaoGrupo(v){
  const t=norm(v.formaTxt||'');
  if(v.forma==='Pix') return 'Pix'; if(v.forma==='Dinheiro') return 'Dinheiro'; if(v.forma==='Cartão') return 'Cartão'; if(v.forma==='Cheque') return 'Cheque';
  if(/BOLETO/.test(t)) return 'Boleto';
  if(v.forma==='Transferência') return 'Transferência';
  if(v.forma==='A prazo'){ let m=t.match(/\b(\d{1,3}(?:\/\d{1,3})+)\b/); if(m) return m[1]+' DD'; m=t.match(/\b(\d{1,3})\s*(DIAS|DIA|DD|D)\b/); if(m) return m[1]+' DD'; return 'A prazo (outros)'; }
  return 'Outros';
}
function gruposCondicao(vendas){
  const g={}; vendas.forEach(v=>{ const k=condicaoGrupo(v); (g[k]=g[k]||{label:k,total:0,itens:[]}); g[k].total+=v.valor; g[k].itens.push(v); });
  const arr=Object.values(g).sort((a,b)=>b.total-a.total); let ip=0;
  arr.forEach(x=>{ x.cor=COR_COND[x.label]||COR_PRAZO[(ip++)%COR_PRAZO.length]; x.prazo=/ DD$/.test(x.label)||x.label==='A prazo (outros)'; });
  return arr;
}
function graficoCondicoes(C,titulo){
  const gs=gruposCondicao(C.vendas); const tot=gs.reduce((a,x)=>a+x.total,0);
  if(!tot) return `<section class="block"><h2>${titulo}</h2><div class="panel empty">Nenhuma venda no período.</div></section>`;
  const R=62, CIRC=2*Math.PI*R; let off=0;
  const segs=gs.map(x=>{ const len=CIRC*x.total/tot; const sseg=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${x.cor}" stroke-width="28" stroke-dasharray="${Math.max(0,len-1.2)} ${CIRC}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(x.label)}: ${money(x.total)}</title></circle>`; off+=len; return sseg; }).join('');
  const prazoTot=gs.filter(x=>x.prazo).reduce((a,x)=>a+x.total,0);
  return `<section class="block"><h2>${titulo}</h2><p class="sub">Toque numa condição para ver os clientes e pedidos.</p>
    <div class="cond-chart"><div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Vendas por condição de pagamento">${segs}
      <text x="80" y="76" text-anchor="middle" class="dz1">${money(tot).replace(/\u00a0/g,' ')}</text><text x="80" y="95" text-anchor="middle" class="dz2">${C.vendas.length} lançamento(s)</text></svg>
      ${prazoTot?`<p class="statusline" style="text-align:center;margin:6px 0 0">A prazo: ${money(prazoTot)} (${Math.round(100*prazoTot/tot)}%)</p>`:''}</div>
    <div class="cond-leg">${gs.map(x=>`<button class="cond-row" data-act="det" data-k="cond" data-f="${esc(x.label)}"><i style="background:${x.cor}"></i><span class="nm">${esc(x.label)}<span class="small">${x.itens.length} lançamento(s)</span></span>
      <span class="br"><span style="width:${Math.max(2,100*x.total/gs[0].total)}%;background:${x.cor}"></span></span><span class="vl">${money(x.total)}<span class="small">${(100*x.total/tot).toFixed(1).replace('.',',')}%</span></span></button>`).join('')}</div></div></section>`;
}

function abrirDet(k,f){

    FORMAS_R.forEach(fm=>C.porForma[fm].itens.forEach(i=>rows.push(Object.assign(linhaItem(i,LI),{forma:fm})))); grupos=FORMAS_R.filter(fm=>C.porForma[fm].total); }
  else if(k==='parciais'){ titulo='Títulos pagos parcialmente'; sub='Valor pago no período e o saldo que ainda falta receber de cada título.'; rows=D.receber.filter(r=>r.parcial&&inP(r.dataBaixa)).map(r=>Object.assign(linhaReceber(r,LI),{data:r.dataBaixa})); }

  else if(k==='forma'){ const fs=String(f).split('|').filter(x=>C.porForma[x]); titulo=fs.length>1?fs.join(' / '):f; sub='Todos os lançamentos que formam este total.';
    rows=fs.flatMap(fm=>C.porForma[fm].itens.map(i=>Object.assign(linhaItem(i,LI),{forma:fm}))); if(fs.length>1) grupos=fs.filter(fm=>C.porForma[fm].itens.length); if(f===BSB) sub='Títulos baixados no período sem forma de recebimento informada. Escolha a forma na coluna Forma: o título sai daqui e vai para a forma escolhida (Dinheiro, Cartão, Pix…).'; }
  else if(k==='cielo'){ titulo='Cielo · recebimento dos cartões'; sub='Cada crédito da Cielo é o repasse dos cartões vendidos no dia anterior. A diferença costuma ser taxa, parcelado ou antecipação.';

    rows=[...C.cielo.map(e=>Object.assign(linhaEntrada(e),{forma:'Recebido da Cielo'})),...dias.flatMap(ref=>[...D.vendas.filter(v=>v.forma==='Cartão'&&v.date===ref).map(linhaVenda),...D.receber.filter(r=>r.baixado&&r.dataBaixa===ref&&r.formaRec==='Cartão').map(r=>Object.assign(linhaReceber(r,LI),{data:r.dataBaixa}))].map(x=>Object.assign(x,{forma:'Cartões vendidos no dia anterior'})))];

    <div class="toolbar"><input class="search" id="ccq" placeholder="Pesquisar venda ou título por cliente, documento ou valor" value="${esc(S.cc.q)}" style="flex:1"></div>

/* ============ lançamento do dia ============ */
function sugestoes(e,q,sel){
  const LI=linkIndex(); q=norm(q||'');
  let cands=candidatos(e,LI).map(k=>Object.assign(k,{score:(k.valorOk?10:0)+k.ns*4-Math.min(Math.abs(k.dd),30)/10-Math.min(1,Math.abs(k.x.valor-e.valor)/e.valor)*5}));
  if(q){ const all=[...D.vendas.filter(v=>v.forma!=='A prazo'),...D.receber].filter(x=>!(LI[x.id]&&LI[x.id].e!==e)&&norm(x.cliente+' '+x.doc+' '+money(x.valor)+' '+(x.pedido||'')).includes(q));
    cands=all.map(x=>({x,tipo:x.col==='vendas'?'venda':'receber',valorOk:x.valor===e.valor,ns:nomeScore(x.cliente,e.pagador+' '+e.desc),dd:dayDiff(x.col==='vendas'?x.date:(x.dataBaixa||x.venc),e.date)})).map(k=>Object.assign(k,{score:(k.valorOk?10:0)+k.ns*4})); }
  sel.forEach(sid=>{ if(!cands.some(k=>k.x.id===sid)&&IDX[sid]) cands.unshift({x:IDX[sid],tipo:IDX[sid].col==='vendas'?'venda':'receber',valorOk:IDX[sid].valor===e.valor,ns:0,dd:0,score:99}); });
  cands.sort((a,b)=>(sel.has(b.x.id)-sel.has(a.x.id))||(b.score-a.score));
  return cands.slice(0,40);
}

async function baixar(nome,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return true; }
  catch(e){ toast('Não consegui baixar o arquivo.'); return false; }
}

/* ============ período ============ */
function setQuick(q){
  S.quick=q;
  if(q==='hoje'){S.de=S.ate=HOJE;} else if(q==='ontem'){S.de=S.ate=addDays(HOJE,-1);} else if(q==='7d'){S.de=addDays(HOJE,-6);S.ate=HOJE;}
  else if(q==='mes'){S.de=HOJE.slice(0,8)+'01';S.ate=HOJE;}
  else { const ds=[...D.entradas.map(e=>e.date),...D.vendas.map(v=>v.date)].filter(Boolean).sort(); S.de=ds[0]||HOJE; S.ate=ds[ds.length-1]||HOJE; }
}

// aceita PDFs e também o arquivo de backup (.json) no mesmo lugar
async function receberArquivos(lista){
  const pdfs=lista.filter(x=>/pdf$/i.test(x.type)||/\.pdf$/i.test(x.name));
  const bks=lista.filter(x=>/json/i.test(x.type)||/\.json(\.txt)?$/i.test(x.name)||/backup/i.test(x.name));
  if(bks.length){ await importarBackup(await bks[0].text()); }
  if(pdfs.length) await importarPdfs(pdfs);
  if(!pdfs.length&&!bks.length) toast('Formato não reconhecido. Envie os PDFs (extrato, Listar Pedido por Data, Contas a Receber) ou o arquivo de backup .json.',7000);
}
$('#fileInput').addEventListener('change',ev=>{ const f=[...ev.target.files]; ev.target.value=''; if(f.length) receberArquivos(f); });
document.addEventListener('dragover',ev=>{ if(ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files')){ ev.preventDefault(); const z=$('[data-drop]'); if(z) z.classList.add('over'); } });
document.addEventListener('dragleave',ev=>{ const z=ev.target.closest&&ev.target.closest('[data-drop]'); if(z) z.classList.remove('over'); });
document.addEventListener('drop',ev=>{ if(!ev.dataTransfer||!ev.dataTransfer.files.length) return; ev.preventDefault(); const z=$('[data-drop]'); if(z) z.classList.remove('over');
  receberArquivos([...ev.dataTransfer.files]); });
async function importarBackup(txt){
  let bk; try{ bk=JSON.parse(txt); }catch(e){ toast('Arquivo de backup inválido.'); return; }
  if(!bk||!bk.dados){ toast('Arquivo de backup inválido.'); return; }
  const n=COLS.reduce((a,c)=>a+((bk.dados[c]||[]).length),0);
  if(!confirm(`Importar ${n} lançamento(s) do backup? Os dados atuais serão substituídos.`)) return;
  toast('Importando o backup…',20000);
  for(const col of COLS){ D[col]=(bk.dados[col]||[]).map(x=>Object.assign(x,{col})); }
  const aj=bk.ajustes||{}; AJ.formas=aj.formas||{}; AJ.conc=aj.conc||{}; AJ.cob=aj.cob||{};
  reindex(); for(const col of COLS){ new Set(D[col].map(x=>gkey(col,x))).forEach(k=>markDirty(col,k)); }
  for(const c of ['formas','conc','cob']) for(const id in AJ[c]) pendAJ.add(c+':'+id);
  await flush(); await enviarAjustes(); aplicarAjustes(); render();
  if(Sync.state==='err'){ toast('O backup não foi gravado por completo. Toque em "tentar de novo" no topo.',8000); return; }
  toast(`Backup importado: ${n} lançamento(s).`);
}
$('#rmInput').addEventListener('change',async ev=>{ const f=[...ev.target.files].filter(x=>/pdf$/i.test(x.type)||/\.pdf$/i.test(x.name)); ev.target.value=''; if(f.length) await removerPdfs(f); });
$('#bkInput').addEventListener('change',async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(f) receberArquivos([f]); });
$('#dlg').addEventListener('close',()=>{ if(S._noRender) return; if(S.tab!=='importar'){ const k=guardarScroll(); render(); restaurarScroll(k); } });

/* ============ início ============ */
(async()=>{
  S.dia=HOJE; setQuick('mes'); render();
  let est; try{ est=await iniciarFirebase(); }catch(e){ telaConfig(e.message); return; }
  if(est==='config'){ telaConfig(); return; } if(est==='login'){ telaLogin(); return; }
  try{ await Store.init(); }catch(e){ telaLogin('Não consegui ler os dados: '+traduzErro(e)); return; }
  for(const col of COLS){ D[col]=await Store.loadAll(col); D[col].forEach(x=>x.col=col); }
  reindex(); await carregarAjustes(); aplicarAjustes(); limparIgnorados(); syncUI();
  if(D.entradas.length||D.vendas.length){ const ds=[...D.entradas.map(e=>e.date),...D.vendas.map(v=>v.date)].filter(d=>d<=HOJE).sort(); if(ds.length&&!ds.includes(HOJE)) S.dia=ds[ds.length-1]; setQuick('mes'); if(!ds.some(d=>d>=S.de)) { setQuick('tudo'); } }
  render(); ouvirTempoReal();
})();
